[project]
name = "keel"
version = "0.1.0"
description = "Keel（龙骨）个人加密量化平台"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "hypothesis>=6.100,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# 依赖锁定策略（Q7）：uv.lock 全量 hash 锁，CI 与本地一律 `uv sync --frozen`。
# 升级必须显式 `uv lock --upgrade-package <name>` 并提交 lock 变更，
# 不允许在测试通过的前提下静默升版本——否则 A4 的可复现性随升级漂移。
