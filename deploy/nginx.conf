server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS。下面用变量写上游时，必须显式声明 resolver 才能解析主机名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # 前端路由用 BrowserRouter，深链接要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代，前端因此不需要知道后端地址。
    #
    # 必须走变量（$api_upstream）而不是直接写 proxy_pass http://api:8000。
    # 写死主机名时 nginx 只在启动那一刻解析一次，之后永远用那个 IP。api 容器
    # 重建会拿到新 IP，web 容器还指着旧地址——症状是 / 正常、/api/ 全部 502
    # connect() failed (111: Connection refused)。那不是 api 挂了，是 web 记错了地址。
    # 走变量时每个请求都按 resolver 重新解析。
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
