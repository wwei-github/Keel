server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由用 BrowserRouter，深链接要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代，前端因此不需要知道后端地址
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
